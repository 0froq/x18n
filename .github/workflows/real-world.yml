name: Real world

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/x18n-real-world
          key: x18n-real-world-${{ hashFiles('test/real-world.test.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:real-world
